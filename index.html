<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ABM NANGA SILAT</title>
  <meta name="description" content="Sistem operasional lapangan PT Afiqa Budi Mulia - Nanga Silat">
  <meta name="theme-color" content="#57534e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">

    <!-- ===== LAYAR LOGIN ===== -->
    <section id="layar-login" class="layar">
      <div class="login-kartu">
        <h1>ABM</h1>
        <p class="login-sub">NANGA SILAT</p>
        <p class="login-pesan">Masuk dengan akun Google perusahaan</p>
        <div id="google-signin"></div>
        <p id="login-error" class="login-error tersembunyi"></p>
        <button id="tombol-daftar" class="tombol-kecil tersembunyi" type="button">Daftar dengan akun ini</button>
        <p id="daftar-catatan" class="login-catatan tersembunyi"></p>
        <p id="login-catatan" class="login-catatan tersembunyi"></p>
      </div>
    </section>

    <!-- ===== LAYAR UTAMA ===== -->
    <section id="layar-utama" class="layar tersembunyi">
      <header class="kepala">
        <div class="kepala-identitas">
          <strong id="nama-user"></strong>
          <span id="peran-user" class="peran"></span>
        </div>
        <button id="tombol-keluar" class="tombol-kecil" type="button">Keluar</button>
      </header>

      <div id="status-antrean" class="status-antrean tersembunyi">
        <span id="teks-antrean"></span>
        <button id="tombol-kirim-sekarang" class="tombol-kecil tombol-kirim" type="button">Kirim sekarang</button>
      </div>

      <main id="isi-menu" class="isi"></main>
      <div id="isi-form" class="isi"></div>
    </section>

  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="./js/config.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/dashboard.js"></script>
</body>
</html>
